name: Feature request
description: Suggest a new control or improvement
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: The control or behaviour you are missing, and how you would use it.
    validations:
      required: true
  - type: input
    id: soundbar-model
    attributes:
      label: Soundbar model
      placeholder: SR-C20A
