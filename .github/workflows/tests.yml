name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-test.txt

      - name: Lint
        run: ruff check --no-cache .

      - name: Unit tests
        run: python -m pytest -q
